[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/cli",
    "apps/desktop/src-tauri",
]
# The desktop app requires GTK/WebKit system libraries (Tauri prerequisite).
# Build it with: cargo build -p harnesscode-desktop
# Default build targets only core + cli to allow builds in headless CI environments.
default-members = [
    "crates/core",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["HarnessCode Contributors"]
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Async trait support
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP client (used by LLM providers)
reqwest = { version = "0.12", features = ["json", "stream"] }

# Async stream utilities
futures = "0.3"

# Config file parsing
toml = "0.8"

# Home/config directory resolution
dirs = "5"

# CLI utilities
clap = { version = "4", features = ["derive", "env"] }
inquire = "0.7"
indicatif = "0.17"

# Tauri
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
